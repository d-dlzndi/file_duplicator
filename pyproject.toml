[project]
name = "file-duplicator"
description = "file duplication program"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyinstaller>=6.22.2",
    "pyqtdarktheme>=2.1.0",
    "pyside6>=6.11.2",
    "requests>=2.34.2",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "hatch>=1.18.0",
    "pyinstaller>=6.22.2",
]

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/version/_version.py"
