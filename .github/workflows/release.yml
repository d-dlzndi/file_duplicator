name: Build and Release

on:
  push:
    tags:
      - 'v*' # v로 시작하는 태그를 푸시할 때 실행

jobs:
  build:
    runs-on: windows-latest # macOS나 Ubuntu로 변경 가능

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 pyinstaller

      - name: PyInstaller로 실행 파일 빌드
        run: |
          pyinstaller --noconsole --onedir file_duplicator.py

      - name: 빌드 결과물 압축 (ZIP)
        run: |
          powershell Compress-Archive -Path dist/main\* -DestinationPath dist/file_duplicator.zip


      - name: 릴리즈 생성 및 파일 업로드
        uses: softprops/action-gh-release@v1
        with:
          files: dist/file_duplicator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
