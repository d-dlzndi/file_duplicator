name: Build and Release

on:
  push:
    # branches: [ main ]
    tags:
      - 'v*' # v로 시작하는 태그를 푸시할 때 실행

jobs:
  build:
    runs-on: windows-latest #ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: uv 설치
        uses: astral-sh/setup-uv@v6
        with:
          # 특정 uv 버전을 고정할 수 있습니다 (선택 사항)
          # version: "0.6.2"
          
          # 파이썬 버전이 명시되지 않은 경우 pyproject.toml 등을 참조해 자동 설치
          enable-cache: true
          

      - name: 의존성 동기화 (Sync)
        run: uv sync --all-extras --dev


      - name: Get version
        shell: pwsh
        run: |
          $version = uv run python -c "from file_duplicator import __version__; print(__version__)"
          Write-Host "Version: $version"
          "VERSION=$version" >> $env:GITHUB_ENV


      - name: Create Windows version resource
        run: uv run python scripts/create_version_info.py
          # create_version_info.py 파일을 실행해서
          # 파이썬 version_info.txt 파일 자체를 쌩으로 생성한다. (근데 이거 맞아?)


      - name: Build executable - pyinstaller 실행
        run: |
          uv run pyinstaller `
            --noconfirm `
            --noconsole `
            --onedir `
            --clean `
            --name "File-Duplicator-$env:VERSION" `
            --add-data "app_icon.ico;." `
            --icon="app_icon.ico" `
            --version-file "build/version_info.txt" `
            main.py


      # - name: 빌드 결과물 압축 (ZIP)
      #   run: |
      #     powershell Compress-Archive -Path dist/main\* -DestinationPath dist/file_duplicator.zip


      # - name: 릴리즈 생성 및 파일 업로드
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     files: dist/file_duplicator.zip
