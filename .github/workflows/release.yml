name: Build and Release

on:
  push:
    branches: [ main ]
    # tags:
    #   - 'v*' # v로 시작하는 태그를 푸시할 때 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          # 특정 uv 버전을 고정할 수 있습니다 (선택 사항)
          # version: "0.6.2"
          
          # 파이썬 버전이 명시되지 않은 경우 pyproject.toml 등을 참조해 자동 설치
          enable-cache: true

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 동기화 (Sync)
        run: uv sync --all-extras --dev

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 pyinstaller

      - name: PyInstaller로 실행 파일 빌드
        run: |
          pyinstaller --noconsole --onedir file_duplicator.py

      - name: 빌드 결과물 압축 (ZIP)
        run: |
          powershell Compress-Archive -Path dist/main\* -DestinationPath dist/file_duplicator.zip


      - name: 릴리즈 생성 및 파일 업로드
        uses: softprops/action-gh-release@v1
        with:
          files: dist/file_duplicator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
